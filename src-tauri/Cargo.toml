[package]
name = "photostudio-app"
version = "0.1.0"
edition = "2021"
description = "PhotoStudio desktop app (Tauri v2): local photo library, non-destructive editor, local AI upscaling"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
photostudio-core = { path = "../rust/core" }
photostudio-ai-worker = { path = "../rust/worker" }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
